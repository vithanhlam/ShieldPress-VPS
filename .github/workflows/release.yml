name: Build release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Build release package and checksum
        run: |
          tar -czf /tmp/shieldpress.tar.gz -C . shieldpress
          sha256sum /tmp/shieldpress.tar.gz | awk '{print $1 "  shieldpress.tar.gz"}' > /tmp/shieldpress.sha256
          md5sum /tmp/shieldpress.tar.gz | awk '{print $1 "  shieldpress.tar.gz"}' > /tmp/shieldpress.md5

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_tag="${GITHUB_REF_NAME}"
          release_assets=(
            /tmp/shieldpress.tar.gz
            /tmp/shieldpress.sha256
            /tmp/shieldpress.md5
          )

          if gh release view "${release_tag}" >/dev/null 2>&1; then
            # A retry or a re-pushed tag can target an existing release.
            # Replace its assets instead of failing on `gh release create`.
            gh release upload "${release_tag}" "${release_assets[@]}" --clobber
          else
            gh release create "${release_tag}" \
              "${release_assets[@]}" \
              --title "ShieldPress VPS ${release_tag#v}" \
              --generate-notes
          fi
