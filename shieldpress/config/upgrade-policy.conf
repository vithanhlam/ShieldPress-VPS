# ====================================================
# ShieldPress Upgrade Policy
# Controls approved software upgrade versions
# Updated with ShieldPress VPS
# ====================================================
# Format: KEY=value
# Wildcard: 1.26.* allows patches within 1.26
# Multiple patterns are separated by spaces
# ====================================================

# ---- Nginx ----
NGINX_ALLOWED="1.26.* 1.28.* 1.31.*"
NGINX_BLOCKED=""
NGINX_NOTE="Same-branch patch updates only; validate configuration and module compatibility"

# ---- PHP ----
PHP_ALLOWED="8.1.* 8.2.* 8.3.* 8.4.*"
PHP_BLOCKED="8.5.*"
PHP_NOTE="Remi repo, all extensions compatible"

# ---- MariaDB ----
MARIADB_ALLOWED="10.11.* 11.4.*"
MARIADB_BLOCKED="11.5.* 11.6.*"
MARIADB_NOTE="LTS versions only, dump required before major upgrade"

# ---- PostgreSQL ----
POSTGRESQL_ALLOWED="15.* 16.* 17.*"
POSTGRESQL_BLOCKED="18.*"
POSTGRESQL_NOTE="pg_upgrade required for major version changes"

# ---- Node.js ----
NODEJS_ALLOWED="20.* 22.*"
NODEJS_BLOCKED="23.*"
NODEJS_NOTE="LTS versions only"

# ---- OS security updates ----
# Security advisories applied after each ShieldPress update (managed stacks above excluded)
OS_SECURITY_AUTO_UPDATE="yes"

# ---- Policy Version ----
POLICY_VERSION="1.0.1"
POLICY_UPDATED="2026-11-03"
