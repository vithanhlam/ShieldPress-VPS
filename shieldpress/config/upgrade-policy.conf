# ====================================================
# ShieldPress Upgrade Policy
# Kiểm soát version nào được phép nâng cấp
# File này được cập nhật khi ShieldPress VPS update
# ====================================================
# Format: KEY=value
# Wildcard: 1.26.* = cho phép mọi patch trong 1.26
# Multiple: 8.1.* 8.2.* = cho phép nhiều major
# ====================================================

# ---- Nginx ----
NGINX_ALLOWED=1.26.* 1.28.*
NGINX_BLOCKED=
NGINX_NOTE=Mainline branch, tested with HTTP/3

# ---- PHP ----
PHP_ALLOWED=8.1.* 8.2.* 8.3.* 8.4.*
PHP_BLOCKED=8.5.*
PHP_NOTE=Remi repo, all extensions compatible

# ---- MariaDB ----
MARIADB_ALLOWED=10.11.* 11.4.*
MARIADB_BLOCKED=11.5.* 11.6.*
MARIADB_NOTE=LTS versions only, dump required before major upgrade

# ---- PostgreSQL ----
POSTGRESQL_ALLOWED=15.* 16.* 17.*
POSTGRESQL_BLOCKED=18.*
POSTGRESQL_NOTE=pg_upgrade required for major version changes

# ---- Node.js ----
NODEJS_ALLOWED=20.* 22.*
NODEJS_BLOCKED=23.*
NODEJS_NOTE=LTS versions only

# ---- Policy Version ----
POLICY_VERSION=1.0.0
POLICY_UPDATED=2026-07-02
